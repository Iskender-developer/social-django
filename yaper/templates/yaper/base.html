<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1a26;
      --card: #172538;
      --border: #223449;
      --text: #f2f5f8;
      --muted: #8fa3b8;
      --accent: #ff6b8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Figtree", system-ui, sans-serif;
      font-size: 17px;
    }
    a { color: inherit; text-decoration: none; }

    .top {
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 5;
      background: var(--bg);
    }
    .top-inner, .app, .nav-inner { max-width: 560px; margin: 0 auto; }
    .top-inner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 16px;
    }
    .logo { font-size: 30px; font-weight: 800; letter-spacing: -1.5px; display: flex; align-items: center; gap: 6px; }
    .logo i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); display: inline-block; margin-top: 6px; }
    .top-link, .top-inner button {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--muted); font: inherit; font-size: 18px; font-weight: 600;
    }
    .top-right { display: flex; gap: 18px; align-items: center; }
    .top-right form { margin: 0; }

    .app { padding: 8px 16px 130px; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px; margin: 16px 0;
    }
    h1 { font-size: 26px; margin: 0 0 16px; letter-spacing: -0.5px; }
    h2 { font-size: 20px; margin: 24px 0 0; }
    .muted { color: var(--muted); }

    /* posts */
    .post-head { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%; flex: none;
      display: grid; place-items: center;
      font-weight: 800; color: #10202e;
      background: hsl(var(--h) 75% 82%);
    }
    .avatar.big { width: 72px; height: 72px; font-size: 30px; }
    .name { font-weight: 800; }
    .time { color: var(--muted); font-size: 14px; }
    .post-text { font-size: 19px; line-height: 1.45; margin: 16px 0; white-space: pre-wrap; overflow-wrap: anywhere; }

    details.comments summary {
      list-style: none; cursor: pointer; display: inline-flex;
      align-items: center; gap: 8px; color: var(--muted);
    }
    details.comments summary::-webkit-details-marker { display: none; }
    details.comments[open] summary { color: var(--text); }
    .comment-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
    .comment { margin: 0 0 10px; line-height: 1.4; }
    .comment b { font-weight: 800; }
    .comment-form { display: flex; gap: 8px; margin-top: 12px; }
    .comment-form input { flex: 1; }
    .comment-form button { padding: 0 16px; }

    /* forms */
    input[type=text], input[type=password], input[type=email], textarea {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    form p { margin: 0 0 16px; }
    form label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 15px; }
    .helptext, form ul { color: var(--muted); font-size: 13px; }
    .errorlist { color: var(--accent); list-style: none; padding: 0; margin: 0 0 6px; font-size: 14px; }
    .primary {
      background: var(--accent); color: #1a1a1a; border: 0; cursor: pointer;
      border-radius: 12px; padding: 12px 20px; font: inherit; font-weight: 800;
    }
    button.primary.full { width: 100%; }

    /* bottom nav */
    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--bg); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inner { display: flex; justify-content: space-around; align-items: center; padding: 10px 16px; }
    .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); width: 80px; }
    .tab.active { color: var(--text); font-weight: 800; }
    .fab {
      width: 68px; height: 56px; border-radius: 18px; background: var(--accent);
      color: #1a1a1a; display: grid; place-items: center; font-size: 36px; line-height: 1;
      transform: translateY(-8px);
    }
    svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="logo" href="{% url 'home' %}">yaper<i></i></a>
      <div class="top-right">
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
          </form>
        {% else %}
          <a class="top-link" href="{% url 'login' %}">Log in</a>
          <a class="top-link" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="app">
    {% block content %}{% endblock %}
  </main>

  {% if user.is_authenticated %}
  <nav class="bottom">
    <div class="nav-inner">
      <a class="tab {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Feed
      </a>
      <a class="fab" href="{% url 'create_post' %}" aria-label="New post">+</a>
      <a class="tab {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </div>
  </nav>
  {% endif %}
</body>
</html>
