<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<article class="card">
    <div class="post-head">
        <div class="avatar" style="--h: {% widthratio post.author.id 1 137 %}">{{ post.author.user.username|first|upper}}
        </div>
        <div>
            <div class="name">{{ post.author }}</div>
            <div class="time">{{ post.created_at|timesince }} ago</div>
        </div>
    </div>

    <p class="post-text">{{ post.text }}</p>

    <details class="comments">
        <summary>
            <svg viewBox="0 0 24 24">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
            {{ post.comments.count }}
        </summary>

        <div class="comment-list">
            {% for comment in post.comments.all %}
            <p class="comment"><b>{{ comment.author }}</b> {{ comment.text }}</p>
            {% endfor %}

            {% if user.is_authenticated %}
            <form class="comment-form" method="post" action="{% url 'add_comment' post.id %}">
                {% csrf_token %}
                <input type="text" name="text" placeholder="Write a comment..." required>
                <button class="primary" type="submit">Send</button>
            </form>
            {% endif %}
        </div>
    </details>
</article>
</body>
</html>
